<title>Band Seven</title>
<meta name="description" content="3,311 道 College Board 官方数字 SAT 题，按考点与官方分数段出题，带官方解析、错题集间隔复习和 AI 逐题拆解。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
:root{
  --paper:#F1F3EE; --surface:#FBFBF8; --surface-2:#E9ECE4;
  --ink:#191C18; --ink-2:#4C534B; --ink-3:#767D73;
  --rule:#D8DCD1; --rule-2:#C3C8B9;
  --accent:#8A5A00; --accent-soft:#F0E3C8; --accent-ink:#5E3D00;
  --ok:#1B6E39; --ok-soft:#DCEDE0; --bad:#A32A22; --bad-soft:#F5DEDA;
  --b1:#D5DAD0; --b2:#D6D9C2; --b3:#E1D6B0; --b4:#E8CC93;
  --b5:#EBBF6D; --b6:#DFA63C; --b7:#C4890F; --band-ink:#26251A;
  --shadow:0 1px 2px rgba(25,28,24,.06),0 4px 14px rgba(25,28,24,.05);
  --r:5px;
  --rs:1;   /* 阅读字号倍率，由顶栏的 A−/A+ 控制 */
  --f-ui:"Archivo",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --f-read:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131513; --surface:#1B1E1A; --surface-2:#252924;
    --ink:#E7EAE3; --ink-2:#A8AFA4; --ink-3:#7E857A;
    --rule:#2C312B; --rule-2:#3C423A;
    --accent:#E3A93C; --accent-soft:#3A2E15; --accent-ink:#F0C878;
    --ok:#63C687; --ok-soft:#17301F; --bad:#EE8B82; --bad-soft:#331A17;
    --b1:#333831; --b2:#3C4034; --b3:#4B4632; --b4:#5C4E2D;
    --b5:#6F5A28; --b6:#8A6D1F; --b7:#A8821A; --band-ink:#EDE6D2;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#131513; --surface:#1B1E1A; --surface-2:#252924;
  --ink:#E7EAE3; --ink-2:#A8AFA4; --ink-3:#7E857A;
  --rule:#2C312B; --rule-2:#3C423A;
  --accent:#E3A93C; --accent-soft:#3A2E15; --accent-ink:#F0C878;
  --ok:#63C687; --ok-soft:#17301F; --bad:#EE8B82; --bad-soft:#331A17;
  --b1:#333831; --b2:#3C4034; --b3:#4B4632; --b4:#5C4E2D;
  --b5:#6F5A28; --b6:#8A6D1F; --b7:#A8821A; --band-ink:#EDE6D2;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;text-wrap:balance;font-weight:600;letter-spacing:-.01em}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.eyebrow{font-size:10.5px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.hide{display:none!important}

/* ---------- shell ---------- */
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:20px;
  padding:0 20px;height:52px;background:var(--surface);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;gap:9px;font-weight:700;letter-spacing:-.02em;font-size:15px}
.brand .mk{width:9px;height:9px;background:var(--accent);border-radius:1px;transform:translateY(-1px)}
nav.tabs{display:flex;gap:2px;margin-left:6px}
nav.tabs button{padding:6px 11px;border-radius:var(--r);color:var(--ink-2);font-weight:500;font-size:13px}
nav.tabs button:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs button[aria-current="page"]{background:var(--ink);color:var(--surface);font-weight:600}
.spacer{flex:1}
.sizectl{display:flex;align-items:center;border:1px solid var(--rule-2);border-radius:var(--r);overflow:hidden;flex:none}
.sizectl button{padding:5px 10px;font-weight:700;color:var(--ink-2);line-height:1.1}
.sizectl button:first-child{font-size:11px}
.sizectl button:last-child{font-size:15px}
.sizectl button:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.sizectl button:disabled{opacity:.3;cursor:default}
.sizectl .lbl{font-family:var(--f-num);font-size:10.5px;color:var(--ink-3);padding:0 6px;min-width:34px;
  text-align:center;border-left:1px solid var(--rule-2);border-right:1px solid var(--rule-2);align-self:stretch;
  display:flex;align-items:center;justify-content:center}
.ghost{padding:6px 12px;border:1px solid var(--rule-2);border-radius:var(--r);font-size:12.5px;font-weight:500;color:var(--ink-2)}
.ghost:hover{border-color:var(--ink-3);color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:26px 20px 80px}

/* ---------- home ---------- */
.pagehead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.pagehead h1{font-size:25px}
.pagehead p{margin:3px 0 0;color:var(--ink-2);font-size:13.5px;max-width:62ch}
.countdown{margin-left:auto;text-align:right;border-left:2px solid var(--accent);padding-left:14px}
.countdown b{display:block;font-family:var(--f-num);font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-.03em}

.strip{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:26px}
@media(max-width:760px){.strip{grid-template-columns:1fr}}
.meter{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:15px 17px 17px}
.meter header{display:flex;align-items:baseline;gap:8px;margin-bottom:13px}
.meter header h3{font-size:14px}
.meter header .now{margin-left:auto;font-family:var(--f-num);font-size:12px;color:var(--ink-2)}
.bands{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.band{position:relative;height:34px;border-radius:2px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;color:var(--band-ink);font-size:9.5px;font-weight:600;opacity:.34}
.band.on{opacity:1}
.band .r{font-family:var(--f-num);font-size:8.5px;font-weight:500;opacity:.85}
.band.cur{outline:2px solid var(--ink);outline-offset:2px}
.band.tgt::after{content:"";position:absolute;inset:-2px;border:2px dashed var(--ink-3);border-radius:3px}
.meter footer{display:flex;gap:20px;margin-top:13px;padding-top:12px;border-top:1px solid var(--rule)}
.meter footer div{display:flex;flex-direction:column;gap:1px}
.meter footer b{font-family:var(--f-num);font-size:17px;font-weight:700;letter-spacing:-.02em}
.meter footer span{font-size:10.5px;color:var(--ink-3)}

/* ---------- skill table ---------- */
section.block{margin-bottom:30px}
.blockhead{display:flex;align-items:baseline;gap:12px;margin-bottom:11px}
.blockhead h2{font-size:16px}
.blockhead .note{font-size:12px;color:var(--ink-3);margin-left:auto}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r)}
table.skills{width:100%;border-collapse:collapse;min-width:660px}
table.skills th{text-align:left;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);padding:9px 12px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--surface)}
table.skills th.r,table.skills td.r{text-align:right}
table.skills td{padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:middle}
table.skills tr:last-child td{border-bottom:none}
tr.domrow td{background:var(--surface-2);padding:6px 12px}
tr.domrow .dn{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
tr.domrow .dm{font-family:var(--f-num);font-size:11px;color:var(--ink-2);font-weight:500}
tr.skillrow:hover td{background:var(--surface-2)}
.skname{font-weight:500;font-size:13px}
.skmeta{font-family:var(--f-num);font-size:11px;color:var(--ink-3)}
.acc{display:flex;align-items:center;gap:9px;justify-content:flex-end}
.accbar{width:82px;height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;flex:none}
.accbar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.accbar i.good{background:var(--ok)} .accbar i.warn{background:var(--bad)}
.accnum{font-family:var(--f-num);font-size:12.5px;font-weight:600;width:42px;text-align:right}
.dim{color:var(--ink-3)}
.drillbtn{padding:4px 10px;border:1px solid var(--rule-2);border-radius:var(--r);font-size:11.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.drillbtn:hover{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* ---------- drill builder ---------- */
.builder{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:17px 18px}
.presets{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--rule)}
.preset{text-align:left;padding:9px 13px;border:1px solid var(--rule-2);border-radius:var(--r);min-width:150px}
.preset:hover{border-color:var(--accent);background:var(--accent-soft)}
.preset b{display:block;font-size:12.5px;font-weight:600;margin-bottom:2px}
.preset span{font-family:var(--f-num);font-size:10.5px;color:var(--ink-3)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;align-items:start}
.field{display:flex;flex-direction:column;gap:6px}
.field>label{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{padding:4px 9px;border:1px solid var(--rule-2);border-radius:99px;font-size:11.5px;font-weight:500;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
select,input[type=number]{font:inherit;font-size:13px;padding:6px 9px;border:1px solid var(--rule-2);
  border-radius:var(--r);background:var(--surface);color:var(--ink);width:100%}
.toggle{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
.builder footer{display:flex;align-items:center;gap:14px;margin-top:17px;padding-top:15px;border-top:1px solid var(--rule)}
.avail{font-family:var(--f-num);font-size:12px;color:var(--ink-2)}
.avail b{color:var(--ink);font-weight:700}
.primary{margin-left:auto;padding:9px 20px;background:var(--ink);color:var(--surface);
  border-radius:var(--r);font-weight:600;font-size:13.5px}
.primary:hover{background:var(--accent)}
.primary:disabled{opacity:.4;cursor:not-allowed}
.primary:disabled:hover{background:var(--ink)}

/* ---------- practice ---------- */
#view-run{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column}
.runbar{display:flex;align-items:center;gap:14px;height:48px;padding:0 18px;
  background:var(--surface);border-bottom:1px solid var(--rule);flex:none}
.runbar .qn{font-family:var(--f-num);font-size:12.5px;font-weight:600}
.runbar .tag{padding:2.5px 8px;border-radius:99px;background:var(--surface-2);font-size:11px;font-weight:500;color:var(--ink-2)}
.bandpip{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-num);font-size:11px;color:var(--ink-2)}
.bandpip i{width:8px;height:8px;border-radius:2px}
.timer{font-family:var(--f-num);font-size:14px;font-weight:600;letter-spacing:-.01em}
.timer.warn{color:var(--bad)}
.markbtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);border-color:var(--accent)}
.progressline{height:2px;background:var(--surface-2);flex:none}
.progressline i{display:block;height:100%;background:var(--accent);transition:width .25s}

.runbody{flex:1;overflow:hidden;display:grid;grid-template-columns:1fr 1fr}
.runbody.single{grid-template-columns:minmax(0,780px);justify-content:center}
@media(max-width:900px){.runbody{grid-template-columns:1fr;overflow-y:auto}}
.pane{overflow-y:auto;padding:26px 30px 40px}
.pane.left{border-right:1px solid var(--rule)}
@media(max-width:900px){.pane.left{border-right:none;border-bottom:1px solid var(--rule)}}
.pane-inner{max-width:640px;margin:0 auto}

.qtext{font-family:var(--f-read);font-size:calc(16px * var(--rs));line-height:1.62;color:var(--ink)}
.qtext p{margin:0 0 .85em}
.qtext p:last-child{margin-bottom:0}
.qtext em,.qtext i{font-style:italic}
.qtext ul,.qtext ol{margin:.6em 0;padding-left:1.4em}
.qtext li{margin-bottom:.35em}
.qtext table{border-collapse:collapse;margin:1em 0;font-family:var(--f-ui);font-size:13px}
.qtext th,.qtext td{border:1px solid var(--rule-2);padding:6px 11px;text-align:left}
.qtext th{background:var(--surface-2);font-weight:600}
.qtext math{font-size:1.03em}
/* CB figures are inline SVG stroked in near-black — always give them a paper plate */
.qtext figure{margin:1em 0;display:flex;justify-content:center;overflow-x:auto}
.qtext figure svg,.qtext svg{background:#fff;border:1px solid var(--rule-2);border-radius:3px;padding:10px;max-width:100%;height:auto}
.stimwrap{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:22px 24px}
.stemtext{font-family:var(--f-read);font-size:calc(16px * var(--rs));line-height:1.55;font-weight:600;margin-bottom:18px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:11px;text-align:left;width:100%;
  padding:12px 14px;background:var(--surface);border:1px solid var(--rule-2);border-radius:var(--r)}
.opt:hover{border-color:var(--ink-3)}
.opt .ltr{flex:none;width:23px;height:23px;border-radius:50%;border:1.5px solid var(--rule-2);
  display:grid;place-items:center;font-family:var(--f-num);font-size:11.5px;font-weight:700;color:var(--ink-2)}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2)}
.opt[aria-pressed="true"] .ltr{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.opt .oc{font-family:var(--f-read);font-size:calc(15px * var(--rs));line-height:1.5;padding-top:1px}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .ltr{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.chosen-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.chosen-wrong .ltr{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.struck .oc{opacity:.4;text-decoration:line-through}
.opt:disabled{cursor:default}

.sprbox{display:flex;flex-direction:column;gap:8px}
.sprbox input{font-family:var(--f-num);font-size:calc(19px * var(--rs));font-weight:600;padding:12px 15px;
  border:1.5px solid var(--rule-2);border-radius:var(--r);background:var(--surface);color:var(--ink);width:100%}
.sprbox .hint{font-size:11.5px;color:var(--ink-3)}

.runfoot{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--surface);
  border-top:1px solid var(--rule);flex:none;flex-wrap:wrap}
.navdots{display:flex;gap:3px;flex-wrap:wrap;max-width:44%}
.dot{width:19px;height:19px;border-radius:3px;border:1px solid var(--rule-2);font-family:var(--f-num);
  font-size:9.5px;font-weight:600;color:var(--ink-3);display:grid;place-items:center}
.dot.done{background:var(--surface-2);color:var(--ink-2)}
.dot.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.dot.no{background:var(--bad);border-color:var(--bad);color:#fff}
.dot.cur{outline:2px solid var(--ink);outline-offset:1px}
.dot.marked::after{content:"";position:absolute;margin:-14px 0 0 12px;width:5px;height:5px;background:var(--accent);border-radius:50%}

/* ---------- review ---------- */
.verdict{display:flex;align-items:center;gap:11px;padding:11px 15px;border-radius:var(--r);margin-bottom:16px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.no{background:var(--bad-soft);color:var(--bad)}
.verdict b{font-size:14px;font-weight:700}
.verdict .ans{margin-left:auto;font-family:var(--f-num);font-size:12.5px;font-weight:600}
.rat{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--accent);
  border-radius:var(--r);padding:17px 19px;margin-bottom:15px}
.rat .eyebrow{margin-bottom:9px}
.rat .qtext{font-size:calc(14.5px * var(--rs));line-height:1.66}
.why{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:15px 17px;margin-bottom:15px}
.why .eyebrow{margin-bottom:4px}
.why .sub{font-size:12px;color:var(--ink-3);margin-bottom:10px}
.whychips{display:flex;gap:6px;flex-wrap:wrap}
.whychip{padding:6px 12px;border:1px solid var(--rule-2);border-radius:var(--r);font-size:12.5px;font-weight:500;text-align:left}
.whychip:hover{border-color:var(--accent)}
.whychip[aria-pressed="true"]{background:var(--accent);color:var(--surface);border-color:var(--accent)}

/* source attribution — the user asked for every item to carry its provenance */
.srcbox{border:1px dashed var(--rule-2);border-radius:var(--r);padding:12px 14px;background:transparent}
.srcbox .eyebrow{margin-bottom:8px}
.srcgrid{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:11.5px}
.srcgrid dt{color:var(--ink-3)}
.srcgrid dd{margin:0;font-family:var(--f-num);font-size:11px;word-break:break-all}
.srcgrid dd a{color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor}

/* ---------- summary / log / source views ---------- */
.summary{max-width:620px;margin:0 auto;text-align:center;padding:40px 0}
.summary .big{font-family:var(--f-num);font-size:52px;font-weight:700;letter-spacing:-.04em;line-height:1}
.summary .sub{color:var(--ink-2);margin:6px 0 26px}
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-bottom:24px}
.sumgrid div{background:var(--surface);padding:14px 12px}
.sumgrid b{display:block;font-family:var(--f-num);font-size:21px;font-weight:700;letter-spacing:-.02em}
.sumgrid span{font-size:10.5px;color:var(--ink-3)}
.btnrow{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}

.logcard{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:15px 17px;margin-bottom:10px}
.logcard header{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:9px}
.logcard .why-t{padding:2.5px 9px;border-radius:99px;background:var(--bad-soft);color:var(--bad);font-size:11px;font-weight:600}
.logcard .q{font-family:var(--f-read);font-size:calc(14px * var(--rs));color:var(--ink-2);line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.empty{text-align:center;padding:52px 20px;color:var(--ink-3);font-size:13.5px}

.prose{max-width:70ch}
.prose h3{font-size:14px;margin:22px 0 7px}
.prose p{margin:0 0 11px;color:var(--ink-2);font-size:13.5px;line-height:1.65}
.prose code{font-family:var(--f-num);font-size:11.5px;background:var(--surface-2);padding:1.5px 5px;border-radius:3px;word-break:break-all}
.prose ul{margin:0 0 11px;padding-left:18px;color:var(--ink-2);font-size:13.5px;line-height:1.65}
.prose li{margin-bottom:4px}
.prose a{color:var(--accent)}
.warnbox{border:1px solid var(--rule-2);border-left:3px solid var(--accent);border-radius:var(--r);
  padding:13px 15px;background:var(--surface);margin:0 0 16px}
.warnbox p{margin:0;font-size:13px}

#boot{position:fixed;inset:0;background:var(--paper);display:grid;place-items:center;z-index:200}
#boot div{text-align:center}
#boot .bar{width:190px;height:3px;background:var(--surface-2);border-radius:9px;overflow:hidden;margin:15px auto 0}
#boot .bar i{display:block;height:100%;width:38%;background:var(--accent);animation:sl 1.1s ease-in-out infinite}
@keyframes sl{0%{transform:translateX(-100%)}100%{transform:translateX(360%)}}
.timestrip{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:1px;background:var(--rule);

<script>
"use strict";
const PULLED_ON = "2026-09-09";
const BANK_URL = "bank.bin";     // gzip 的题库，与 index.html 同目录

/* ============ official reference data (verified against College Board sources) ============ */
// Skills Insight for the SAT Suite, July 2026, Table 3
const BANDS = [
  {n:1, rw:"<370",    m:"<370",    lo:200},
  {n:2, rw:"370–410", m:"370–410", lo:370},
  {n:3, rw:"420–480", m:"420–460", lo:420},
  {n:4, rw:"490–540", m:"470–540", lo:490},
  {n:5, rw:"550–600", m:"550–600", lo:550},
  {n:6, rw:"610–670", m:"610–670", lo:610},
  {n:7, rw:"680–800", m:"680–800", lo:680},
];
// Assessment Framework / Specifications Overview: operational question distribution
const DOMAINS = {
  INI:{sec:1,name:"Information and Ideas",           cn:"信息与观点", share:"≈26% / 12–14 题"},
  CAS:{sec:1,name:"Craft and Structure",             cn:"技法与结构", share:"≈28% / 13–15 题"},
  EOI:{sec:1,name:"Expression of Ideas",             cn:"观点表达",   share:"≈20% / 8–12 题"},
  SEC:{sec:1,name:"Standard English Conventions",    cn:"标准英语规范",share:"≈26% / 11–15 题"},
  H:  {sec:2,name:"Algebra",                         cn:"代数",       share:"≈35% / 13–15 题"},
  P:  {sec:2,name:"Advanced Math",                   cn:"进阶数学",   share:"≈35% / 13–15 题"},
  Q:  {sec:2,name:"Problem-Solving and Data Analysis",cn:"问题解决与数据分析",share:"≈15% / 5–7 题"},
  S:  {sec:2,name:"Geometry and Trigonometry",       cn:"几何与三角", share:"≈15% / 5–7 题"},
  ZZ: {sec:0,name:"导入试卷",                          cn:"自己上传的题", share:"不计入官方考点统计"},
};
const DOM_ORDER = ["INI","CAS","SEC","EOI","H","P","Q","S"];
const DIFF = {E:"Easy", M:"Medium", H:"Hard"};
const WHY = [
  {k:"knowledge", t:"知识点不会",     d:"这个考点的规则/概念我本来就没掌握"},
  {k:"misread",   t:"读错题/看漏条件", d:"知识会，但题干或图表理解错了"},
  {k:"distractor",t:"排除不掉干扰项",  d:"缩到两个选项之间选错了"},
  {k:"careless",  t:"计算/低级失误",   d:"方法对，算错或填错"},
  {k:"time",      t:"时间不够",       d:"是猜的 / 赶时间没做完"},
];
const TARGET = {1:750, 2:780};
const EXAM_DATE = "2026-12-05";

/* ============ state ============ */
let BANK=[], BYID={}, SKILLS=[], attempts=[], run=null, view="home";
let settings = {key:"", model:"deepseek-v4-pro", base:"https://api.deepseek.com", pref:"", fb:[]};
const hasKey = ()=> !!(settings.key && settings.key.trim());
let reviewQ={};          // qid -> {box, due, adds, lastWhy}
let notesByQ={};         // qid -> {text, ts, doc}

// Leitner intervals, in days, by box. Box 5 = 毕业（不再自动安排）。
const BOX_DAYS = {1:1, 2:3, 3:7, 4:16};
const DAY = 864e5;
const todayKey = ()=> new Date().toISOString().slice(0,10);

const $ = s=>document.querySelector(s);
const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!=null)e.innerHTML=h; return e;};
const esc = s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = (a,b)=> b? Math.round(a/b*100) : null;
const bandOf = s => BANDS.find(b=>b.n===s);

/* ---- 阅读字号 ---- */
const RS_STEPS = [0.85, 1, 1.15, 1.3, 1.5, 1.75];
let rsIdx = 1;
function applyScale(){
  document.documentElement.style.setProperty("--rs", RS_STEPS[rsIdx]);
  try{ localStorage.setItem("b7_rs", String(rsIdx)); }catch(e){}
  document.querySelectorAll(".sizectl .lbl").forEach(l=>
    l.textContent = Math.round(RS_STEPS[rsIdx]*100)+"%");
  document.querySelectorAll(".sizectl button").forEach(b=>{
    if(b.dataset.d==="-1") b.disabled = rsIdx===0;
    if(b.dataset.d==="1")  b.disabled = rsIdx===RS_STEPS.length-1;
  });
}
function sizeControl(){
  const w = el("span","sizectl");
  w.title = "调整题目和解析的字号（Ctrl/⌘ 加 - 或 = 也可以）";
  const mk=(d,label)=>{ const b=el("button",null,label); b.dataset.d=String(d);
    b.setAttribute("aria-label", d<0?"缩小字号":"放大字号");
    b.onclick=()=>{ rsIdx=Math.max(0,Math.min(RS_STEPS.length-1, rsIdx+d)); applyScale(); }; return b; };
  w.appendChild(mk(-1,"A"));
  w.appendChild(el("span","lbl", Math.round(RS_STEPS[rsIdx]*100)+"%"));
  w.appendChild(mk(1,"A"));
  return w;
}

function toast(msg){
  const old=$("#toast"); if(old) old.remove();
  const t=el("div"); t.id="toast"; t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(),2600);
}

/* ============ boot ============ */
async function inflate(url){
  const r = await fetch(url, {cache:"force-cache"});
  if(!r.ok) throw new Error("题库下载失败 HTTP "+r.status);
  const buf = await r.arrayBuffer();
  const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}

async function boot(){
  try{
    BANK = await inflate(BANK_URL);
  }catch(e){
    $("#boot").innerHTML = '<div class="prose" style="padding:30px;max-width:520px">'+
      '<h3>题库加载失败</h3>'+
      '<p>可能的原因：网络问题；或浏览器太旧不支持 DecompressionStream（需要 Chrome 80+ / Safari 16.4+ / Firefox 113+）；'+
      '或者 bank.bin 没和 index.html 放在同一个目录。</p>'+
      '<p><code>'+esc(e.message)+'</code></p></div>';
    return;
  }
  BANK.forEach(q=>BYID[q.id]=q);
  buildSkillIndex();
  loadAll();
  try{ const v=+localStorage.getItem("b7_rs"); if(v>=0 && v<RS_STEPS.length) rsIdx=v; }catch(e){}
  $("#topsize").appendChild(sizeControl());
  applyScale();
  $("#boot").remove();
  $("#topbar").classList.remove("hide");
  $("#app").classList.remove("hide");
  render();
}

function buildSkillIndex(){
  const m = new Map();
  BANK.forEach(q=>{
    const key = q.dom+"|"+q.sk;
    if(!m.has(key)) m.set(key,{dom:q.dom, sec:q.sec, sk:q.sk, total:0, bands:{}});
    const s=m.get(key); s.total++; s.bands[q.bd]=(s.bands[q.bd]||0)+1;
  });
  SKILLS=[...m.values()].sort((a,b)=>
    DOM_ORDER.indexOf(a.dom)-DOM_ORDER.indexOf(b.dom) || b.total-a.total);
}

/* ============ 本地存储 ============
   独立站点没有服务器，所有记录存在这台浏览器的 localStorage 里。
   换电脑要用「设置 → 导出进度」搬一个 JSON 过去再导入。 */
const LS = {attempts:"b7_attempts", review:"b7_review", notes:"b7_notes", settings:"b7_settings"};
function lsGet(k, dflt){
  try{ const v=localStorage.getItem(k); return v==null? dflt : JSON.parse(v); }
  catch(e){ return dflt; }
}
let storageWarned = false;
function lsSet(k, v){
  try{ localStorage.setItem(k, JSON.stringify(v)); return true; }
  catch(e){
    if(!storageWarned){
      storageWarned = true;
      toast("浏览器存储已满，新记录没能保存 — 去设置里导出进度并清理");
    }
    return false;
  }
}
function loadAll(){
  attempts = lsGet(LS.attempts, []);
  reviewQ  = lsGet(LS.review, {});
  notesByQ = lsGet(LS.notes, {});
  sessions = lsGet("b7_sessions", []);
  papers   = lsGet("b7_papers", []);
  papers.forEach(p=> (p.qs||[]).forEach(q=>{ BYID[q.id]=q; }));
  settings = Object.assign({key:"",model:"deepseek-v4-pro",base:"https://api.deepseek.com",pref:"",fb:[]},
                           lsGet(LS.settings, {}));
  syncNote();
}
function syncNote(){
  const n = document.querySelector("#syncnote"); if(!n) return;
  n.textContent = attempts.length + " 条作答 · 存在本机";
}
const saveLocal    = ()=>{ lsSet(LS.attempts, attempts.slice(-8000)); syncNote(); };
const flushReview  = async ()=>{ lsSet(LS.review, reviewQ); };
const saveSettings = ()=>{ lsSet(LS.settings, settings); };

async function recordAttempt(a){ attempts.push(a); saveLocal(); }
async function patchAttempt(aid, fields){
  const a = attempts.find(x=>x.aid===aid); if(!a) return;
  Object.assign(a, fields); saveLocal();
}
async function saveNote(qid, text){
  notesByQ[qid] = {text, ts:Date.now()};
  lsSet(LS.notes, notesByQ);
}

/* ---- 错题集：Leitner 盒子 + 到期复习 ---- */
function collect(qid, why){
  const now = Date.now(), cur = reviewQ[qid];
  reviewQ[qid] = {box:1, due: now + BOX_DAYS[1]*DAY, adds:(cur&&cur.adds||0)+1, lastWhy: why||null, ts:now};
}
function gradeReview(qid, ok){
  const r = reviewQ[qid]; if(!r) return;
  if(ok){
    const nb = Math.min(5, (r.box||1)+1);
    if(nb>=5){ delete reviewQ[qid]; return; }
    r.box=nb; r.due = Date.now() + BOX_DAYS[nb]*DAY;
  }else{ r.box=1; r.due = Date.now() + BOX_DAYS[1]*DAY; }
}
const dueList = ()=> Object.entries(reviewQ)
  .filter(([qid,r])=> r.due<=Date.now() && BYID[qid])
  .sort((a,b)=>a[1].due-b[1].due)
  .map(([qid])=>BYID[qid]);

/* ---- 文件下载：普通网站用 <a download> 就行 ---- */
function saveFile(filename, blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}

/* ---- 进度导入导出：换电脑靠这个 ---- */
function exportProgress(){
  const payload = {
    _format:"band-seven-progress", _version:1, exportedAt:new Date().toISOString(),
    attempts, review:reviewQ, notes:notesByQ,
    settings:{model:settings.model, base:settings.base, pref:settings.pref, fb:settings.fb}
  };
  saveFile("band-seven-进度-"+todayKey()+".json",
           new Blob([JSON.stringify(payload)], {type:"application/json"}));
  toast("已导出（不含 API key）");
}
function importProgress(file, mode){
  const fr = new FileReader();
  fr.onload = ()=>{
    let d;
    try{ d = JSON.parse(fr.result); }catch(e){ return toast("文件不是合法的 JSON"); }
    if(!d || d._format!=="band-seven-progress") return toast("这不是本工具导出的进度文件");
    if(mode==="replace"){
      attempts = d.attempts||[]; reviewQ = d.review||{}; notesByQ = d.notes||{};
    }else{
      const seen = new Set(attempts.map(a=>a.aid));
      (d.attempts||[]).forEach(a=>{ if(!seen.has(a.aid)) attempts.push(a); });
      attempts.sort((a,b)=>(a.ts||0)-(b.ts||0));
      Object.entries(d.review||{}).forEach(([k,v])=>{
        if(!reviewQ[k] || v.due < reviewQ[k].due) reviewQ[k]=v;
      });
      Object.entries(d.notes||{}).forEach(([k,v])=>{ if(!notesByQ[k]) notesByQ[k]=v; });
    }
    if(d.settings){
      settings.pref  = d.settings.pref  || settings.pref;
      settings.fb    = d.settings.fb    || settings.fb;
      settings.model = d.settings.model || settings.model;
      saveSettings();
    }
    saveLocal(); lsSet(LS.review, reviewQ); lsSet(LS.notes, notesByQ);
    toast("已导入 "+attempts.length+" 条作答、"+Object.keys(reviewQ).length+" 道错题");
    render();
  };
  fr.readAsText(file);
}

/* ============ stats ============ */
function statsFor(filterFn){
  const rows = attempts.filter(filterFn);
  const n=rows.length, ok=rows.filter(r=>r.ok).length;
  const ms=rows.reduce((s,r)=>s+(r.ms||0),0);
  return {n, ok, acc:pct(ok,n), sec: n? Math.round(ms/n/1000):0};
}
const skillStats = (dom,sk)=> statsFor(r=>r.dom===dom && r.sk===sk);

/* ============ views ============ */
function render(){
  document.querySelectorAll("nav.tabs button").forEach(b=>
    b.setAttribute("aria-current", b.dataset.view===view?"page":"false"));
  const app=$("#app"); app.innerHTML="";
  ({home:renderHome, log:renderLog, paper:renderImport, settings:renderSettings, source:renderSource}[view])(app);
  window.scrollTo(0,0);
}

function daysLeft(){
  return Math.max(0, Math.ceil((new Date(EXAM_DATE+"T00:00:00") - new Date())/864e5));
}

function renderHome(app){
  const head = el("div","pagehead");
  head.innerHTML = `<div>
      <h1>控制台</h1>
      <p>3,311 道 College Board 官方数字 SAT 题，按 domain / 考点 / 难度 / 官方分数段筛选。
         作答前不显示答案；答错必须标注原因，这些记录是后续拆解的依据。</p>
    </div>
    <div class="countdown"><span class="eyebrow">距 12 月 5 日</span><b class="num">${daysLeft()}</b>
      <span class="eyebrow">天</span></div>`;
  app.appendChild(head);

  if(!hasKey()){
    const nag = el("div","keynag");
    nag.innerHTML = `<span class="t"><b>还没接 DeepSeek。</b>刷题、官方解析、错题集、Word 导出都能正常用；
      只有「AI 拆解」和「薄弱点分析」需要填一个自己的 API key。</span>`;
    const b = el("button","ghost","去设置");
    b.onclick=()=>gotoView("settings");
    nag.appendChild(b);
    app.appendChild(nag);
  }

  // 今日待复习
  const due = dueList();
  const total = Object.keys(reviewQ).length;
  if(total){
    const card = el("div","duecard");
    const boxes = [1,2,3,4].map(b=>{
      const n = Object.values(reviewQ).filter(r=>r.box===b).length;
      return `<span class="boxpip">${BOX_DAYS[b]}天 ${n}</span>`;
    }).join("");
    card.innerHTML = `<span class="n">${due.length}</span>

function bandMeter(sec, title, current){
  const m = el("div","meter");
  const cur = BANDS.find(b=> current>=b.lo && (b.n===7 || current < BANDS[b.n].lo));
  const tgt = BANDS.find(b=> TARGET[sec]>=b.lo && (b.n===7 || TARGET[sec] < BANDS[b.n].lo));
  const st = statsFor(r=>r.sec===sec && !r.mockOnly && r.dom!=="ZZ");
  const hi = statsFor(r=>r.sec===sec && r.dom!=="ZZ" && r.bd>= (sec===1?5:6));
  m.innerHTML = `<header><h3>${title}</h3>
    <span class="now num">现 ${current} → 目标 ${TARGET[sec]}</span></header>`;
  const bands = el("div","bands");
  BANDS.forEach(b=>{
    const d = el("div","band"+(b.n<=cur.n?" on":"")+(b.n===cur.n?" cur":"")+(b.n===tgt.n?" tgt":""));
    d.style.background = `var(--b${b.n})`;
    d.innerHTML = `<span>${b.n}</span><span class="r">${sec===1?b.rw:b.m}</span>`;
    d.title = `Band ${b.n} · ${sec===1?b.rw:b.m}（Skills Insight, July 2026, Table 3）`;
    bands.appendChild(d);
  });
  m.appendChild(bands);
  const f = el("footer");
  f.innerHTML = `
    <div><b class="num">${st.n}</b><span>已做题</span></div>
    <div><b class="num">${st.acc==null?"—":st.acc+"%"}</b><span>总正确率</span></div>
    <div><b class="num">${hi.acc==null?"—":hi.acc+"%"}</b><span>band ${sec===1?"5–7":"6–7"} 正确率</span></div>`;
  m.appendChild(f);
  return m;
}

/* ---------- drill builder ---------- */
let cfg = {sec:1, doms:[], skills:[], bands:[], diffs:[], n:15, fresh:true, timed:true};

function pick(c){
  const seen = new Set(attempts.map(a=>a.qid));
  let pool = BANK.filter(q=>
    q.sec===c.sec &&
    (!c.doms.length   || c.doms.includes(q.dom)) &&
    (!c.skills.length || c.skills.includes(q.sk)) &&
    (!c.bands.length  || c.bands.includes(q.bd)) &&
    (!c.diffs.length  || c.diffs.includes(q.df)));
  if(c.fresh){ const f = pool.filter(q=>!seen.has(q.id)); if(f.length >= Math.min(c.n,5)) pool=f; }
  for(let i=pool.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [pool[i],pool[j]]=[pool[j],pool[i]]; }
  return pool.slice(0,c.n);
}
const poolSize = c => pick({...c, n:1e9}).length;

  sel.onchange = ()=>{ cfg.skills = sel.value? [sel.value] : []; app_rebuildBuilder(root); };
  fields.appendChild(mk("考点", sel));

  fields.appendChild(mk("Score band", chipRow(
    [1,2,3,4,5,6,7].map(n=>({t:String(n),v:n})), cfg.bands, v=>{cfg.bands=tog(cfg.bands,v);})));
  fields.appendChild(mk("难度", chipRow(
    [{t:"Easy",v:"E"},{t:"Medium",v:"M"},{t:"Hard",v:"H"}], cfg.diffs, v=>{cfg.diffs=tog(cfg.diffs,v);})));

  const nIn = el("input"); nIn.type="number"; nIn.min=5; nIn.max=60; nIn.value=cfg.n;
  nIn.onchange=()=>{ cfg.n=Math.max(1,Math.min(60,+nIn.value||15)); app_rebuildBuilder(root); };
  const opts = el("div","field");
  opts.appendChild(el("label",null,"选项"));
  const t1=el("label","toggle"); const c1=el("input"); c1.type="checkbox"; c1.checked=cfg.fresh;
  c1.onchange=()=>{cfg.fresh=c1.checked; app_rebuildBuilder(root);};
  t1.appendChild(c1); t1.appendChild(document.createTextNode("跳过做过的题")); opts.appendChild(t1);
  const t2=el("label","toggle"); const c2=el("input"); c2.type="checkbox"; c2.checked=cfg.timed;
  c2.onchange=()=>{cfg.timed=c2.checked;};
  t2.appendChild(c2); t2.appendChild(document.createTextNode("计时（按考试节奏）")); opts.appendChild(t2);
  fields.appendChild(mk("题量", nIn));
  fields.appendChild(opts);

  const avail = poolSize(cfg);
  const foot = root.querySelector("#bfoot"); foot.innerHTML="";
  foot.appendChild(el("span","avail", `符合条件 <b>${avail}</b> 题 · 本次抽取 ${Math.min(avail,cfg.n)} 题`));
  const go = el("button","primary","开始练习");

    const qs = pick(cfg);
    if(!qs.length) return toast("没有符合条件的题");
    startRun(qs, {label: cfg.skills[0] || (cfg.doms.length? cfg.doms.map(d=>DOMAINS[d].name).join(" / ") : (cfg.sec===1?"Reading & Writing":"Math")), timed:cfg.timed});
  };

/* ============ 学习时长 ============ */
let sessions = [];
const minutesOf = ms => Math.round(ms/60000);
function logSession(rec){
  sessions.push(rec);
  lsSet("b7_sessions", sessions.slice(-1200));
}
function timeStats(){
  const now = new Date();
  const dayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const weekStart = dayStart - ((now.getDay()+6)%7)*DAY;     // 周一为一周之始
  const sum = f => sessions.filter(f).reduce((s,r)=>s+(r.activeMs||0),0);
  return {
    today: sum(r=>r.endTs>=dayStart),
    week:  sum(r=>r.endTs>=weekStart),
    all:   sum(()=>true),
    days:  new Set(sessions.map(r=>new Date(r.endTs).toISOString().slice(0,10))).size
  };
}

/* ============ 模考 ============
   结构取自 College Board 官方规格：
   R&W 两个模块各 27 题 / 32 分钟；Math 两个模块各 22 题 / 35 分钟；两个 section 之间休息 10 分钟。
   第二模块难度由第一模块表现决定（自适应路由）。 */
const MOCK = {
  1: {mods:2, perMod:27, minutes:32, name:"Reading and Writing",
      mix:{CAS:8, INI:7, SEC:7, EOI:5}, order:["CAS","INI","SEC","EOI"]},
  2: {mods:2, perMod:22, minutes:35, name:"Math",
      mix:{H:8, P:8, Q:3, S:3}, order:["H","P","Q","S"]}
};
const ROUTE_CUT = 0.6;   // 第一模块正确率达到这个值就路由到难模块

function drawMix(sec, bands, diffs, used){
  const cfgm = MOCK[sec], out = [];
  cfgm.order.forEach(dom=>{
    let pool = BANK.filter(q=> q.sec===sec && q.dom===dom && !used.has(q.id)
      && (!bands.length || bands.includes(q.bd))
      && (!diffs.length || diffs.includes(q.df)));
    if(pool.length < cfgm.mix[dom]) {                       // 条件太窄就放宽难度限制
      pool = BANK.filter(q=> q.sec===sec && q.dom===dom && !used.has(q.id));
    }
    for(let i=pool.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [pool[i],pool[j]]=[pool[j],pool[i]]; }
    const take = pool.slice(0, cfgm.mix[dom]);
    // 每个 domain 内部由易到难，和真考一致
    const rank = {E:0, M:1, H:2};
    take.sort((a,b)=> (rank[a.df]??1)-(rank[b.df]??1) || (a.bd||0)-(b.bd||0));
    take.forEach(q=>used.add(q.id));
    out.push(...take);
  });
  return out;
}

function buildStage(sec, which, used){
  const easyBands = [1,2,3,4], hardBands = [4,5,6,7];
  const b = which==="M1" ? [2,3,4,5] : (which==="hard" ? hardBands : easyBands);
  const d = which==="M1" ? [] : (which==="hard" ? ["M","H"] : ["E","M"]);
  return {
    sec, which,
    label: MOCK[sec].name + (which==="M1" ? " · 模块 1" : " · 模块 2" + (which==="hard"?"（难）":"（易）")),
    minutes: MOCK[sec].minutes,
    qs: drawMix(sec, b, d, used)
  };
}

function startMock(kind){
  const used = new Set();
  const secs = kind==="full" ? [1,2] : [kind];
  const plan = {kind, secs, used, stages:[], si:0, results:[], startTs:Date.now()};
  plan.stages.push(buildStage(secs[0], "M1", used));
  mockPlan = plan;
  beginStage();
}
let mockPlan = null;

function beginStage(){
  const st = mockPlan.stages[mockPlan.si];
  sessionAnalysis = "";
  run = {
    qs: st.qs, i:0, label: st.label, timed:true, finished:false, review:false,
    blind:true, mock:true, stage:st,
    deadline: Date.now() + st.minutes*60000,
    state: st.qs.map(()=>({picked:null, sub:false, ok:null, ms:0, marked:false, struck:[], aid:null, why:null})),
    t0: Date.now(), total0: Date.now(), pausedTotal:0
  };
  $("#view-run").classList.remove("hide");
  document.body.style.overflow="hidden";
  drawRun();
  tick();
}

function finishStage(){
  const st = mockPlan.stages[mockPlan.si];
  let ok=0;
  run.state.forEach((s,k)=>{
    const q = run.qs[k];
    const got = s.picked!=null && (q.ty==="spr" ? sprMatch(s.picked,q.an) : q.an.includes(s.picked));
    s.ok = !!got; s.sub = true;
    if(got) ok++;
  });
  mockPlan.results.push({stage:st, ok, n:st.qs.length, state:run.state, qs:run.qs});
  clearInterval(run._t);

  // 路由 / 下一阶段
  if(st.which==="M1"){
    const route = (ok/st.qs.length) >= ROUTE_CUT ? "hard" : "easy";
    mockPlan.stages.push(buildStage(st.sec, route, mockPlan.used));
    mockPlan.si++;
    return drawTransition(`${MOCK[st.sec].name} 模块 1 结束`,
      `第一模块 ${ok} / ${st.qs.length} 正确。按真考规则，第二模块路由到<b>${route==="hard"?"较难":"较易"}</b>那一组。`,
      "开始模块 2", beginStage);
  }
  // section 结束
  const nextSecIdx = mockPlan.secs.indexOf(st.sec)+1;
  if(nextSecIdx < mockPlan.secs.length){
    const nx = mockPlan.secs[nextSecIdx];
    mockPlan.stages.push(buildStage(nx, "M1", mockPlan.used));
    mockPlan.si++;
    return drawBreak(10, ()=>beginStage());
  }
  drawMockReport();
}

function drawTransition(title, html, btnText, next){
  const root=$("#view-run"); root.innerHTML="";
  const wrap = el("div","stagewrap");
  wrap.innerHTML = `<div class="stageinner">
      <div class="eyebrow">模考进行中</div>
      <h2>${esc(title)}</h2><p>${html}</p></div>`;
  const b = el("button","primary",btnText);
  b.onclick = next;
  wrap.querySelector(".stageinner").appendChild(b);
  root.appendChild(wrap);
}

function drawBreak(minutes, next){
  const root=$("#view-run"); root.innerHTML="";
  const until = Date.now() + minutes*60000;
  const wrap = el("div","stagewrap");
  wrap.innerHTML = `<div class="stageinner">
      <div class="eyebrow">休息</div>
      <h2>10 分钟休息</h2>
      <p>真考在 Reading and Writing 和 Math 之间有一次 10 分钟休息。可以提前结束。</p>
      <div class="bigtimer num" id="brk">10:00</div></div>`;
  const b = el("button","primary","提前开始 Math");
  const inner = wrap.querySelector(".stageinner");
  inner.appendChild(b);
  root.appendChild(wrap);
  const t = setInterval(()=>{
    const left = Math.max(0, Math.round((until-Date.now())/1000));
    const e=$("#brk"); if(!e){ clearInterval(t); return; }
    e.textContent = String((left/60)|0).padStart(2,"0")+":"+String(left%60).padStart(2,"0");
    if(left<=0){ clearInterval(t); next(); }
  }, 500);
  b.onclick = ()=>{ clearInterval(t); next(); };
}

/* ============ practice run ============ */
function startRun(qs, opt){
  if(!qs || !qs.length){ toast("没有符合条件的题"); return; }
  sessionAnalysis = "";
  run = { qs, i:0, label:opt.label, timed:opt.timed!==false, finished:false, review:!!opt.review,
          state: qs.map(()=>({picked:null, sub:false, ok:null, ms:0, marked:false, struck:[], aid:null, why:null})),
          t0: Date.now(), total0: Date.now() };
  $("#view-run").classList.remove("hide");
  document.body.style.overflow="hidden";
  drawRun();
  tick();
}
function endRun(){
  if(run.finished) return;
  saveTime();
  if(run.mock){ run.finished=true; return finishStage(); }
  run.finished = true;
  clearInterval(run._t);
  const done = run.state.filter(s=>s.sub);
  const ok = done.filter(s=>s.ok).length;
  const activeMs = run.state.reduce((t,s)=>t+(s.ms||0),0);
  const secs = Math.round(activeMs/1000);
  logSession({label:run.label, mode:"drill", startTs:run.total0, endTs:Date.now(),
              activeMs, n:done.length, ok});
  drawSummary(done.length, ok, secs);
}
function closeRun(){
  if(run && run._t) clearInterval(run._t);
  run=null;
  $("#view-run").classList.add("hide"); $("#view-run").innerHTML="";
  document.body.style.overflow="";
  render();
}

function pauseRun(){
  if(!run || run.paused || run.finished) return;
  saveTime();                       // 把当前题已用时间结算掉，暂停期间不计时
  run.paused = true;
  run.pauseStart = Date.now();
  drawRun();
}
function resumeRun(){
  if(!run || !run.paused) return;
  const gap = Date.now() - run.pauseStart;
  run.pausedTotal = (run.pausedTotal||0) + gap;
  if(run.deadline) run.deadline += gap;
  run.paused = false;
  run.t0 = Date.now();
  drawRun();
}

function tick(){
  run._t = setInterval(()=>{
    const t = $("#timer"); if(!t || !run) return;
    if(run.paused) return;
    if(run.deadline){
      const left = Math.max(0, Math.round((run.deadline-Date.now())/1000));
      t.textContent = String((left/60)|0).padStart(2,"0")+":"+String(left%60).padStart(2,"0");
      t.classList.toggle("warn", left<=300);        // 最后 5 分钟提醒
      if(left<=0){
        clearInterval(run._t); saveTime();
        if(run.mock) finishStage(); else { toast("时间到"); endRun(); }
      }
      return;
    }
    const st = run.state[run.i];
    const s = Math.round((Date.now()-run.t0)/1000) + Math.round((st.ms||0)/1000);
    t.textContent = String((s/60)|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
    const cap = run.qs[run.i].sec===1 ? 71 : 95;   // R&W 32min/27q ≈ 71s, Math 35min/22q ≈ 95s
    t.classList.toggle("warn", s>cap);
  },500);
}

function saveTime(){ const st=run.state[run.i]; st.ms += Date.now()-run.t0; }

function normSpr(v){
  return String(v).trim().replace(/\s+/g,"").replace(/^\+/,"").replace(/^0+(?=\d)/,"");
}
function sprMatch(input, keys){
  const a = normSpr(input);
  return keys.some(k=>{
    const b = normSpr(k);
    if(a===b) return true;
    const num = s=>{ if(/^-?\d+\/\d+$/.test(s)){ const [p,r]=s.split("/"); return +p/+r; } return parseFloat(s); };
    const x=num(a), y=num(b);
    return isFinite(x)&&isFinite(y) && Math.abs(x-y) < 1e-6;
  });
}

async function submit(){
  if(run.mock) return;                 // 模考交卷前不判分
  const q = run.qs[run.i], st = run.state[run.i];
  if(q.ty==="spr"){ const inp=$("#sprin"); st.picked = inp? inp.value.trim() : st.picked; }
  if(!st.picked) return;
  saveTime(); run.t0 = Date.now();
  st.ok = q.ty==="spr" ? sprMatch(st.picked, q.an) : q.an.includes(st.picked);
  st.sub = true;
  st.aid = q.id + "-" + Date.now().toString(36);
  await recordAttempt({
    aid: st.aid, qid:q.id, eid:q.eid, sec:q.sec, dom:q.dom, sk:q.sk, df:q.df, bd:q.bd, ty:q.ty,
    picked: st.picked, correct: q.an.join("|"), ok: st.ok, ms: st.ms, why: null,
    ts: Date.now(), session: run.label, review: !!run.review
  });
  // 错题自动进错题集；复习模式下按对错升降盒子
  if(run.review && reviewQ[q.id]) gradeReview(q.id, st.ok);
  else if(!st.ok) collect(q.id, null);
  await flushReview();
  drawRun();
}

/* ============ DeepSeek ============
   浏览器直连 api.deepseek.com（已确认该接口返回 CORS 头）。
   API key 只存在访问者自己浏览器的 localStorage 里，不进仓库、不上传任何服务器。 */
const DS_MODELS = [
  {id:"deepseek-v4-pro", t:"deepseek-v4-pro", d:"推理更强，讲题更细，贵一些"},
  {id:"deepseek-flash",  t:"deepseek-flash",  d:"快且便宜，日常够用"},
];

async function dsChat(prompt, {onText, signal, temperature}={}){
  if(!hasKey()){ const e=new Error("no key"); e.code="no_key"; throw e; }
  const base = (settings.base||"https://api.deepseek.com").replace(/\/+$/,"");
  let r;
  try{
    r = await fetch(base+"/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json", "Authorization":"Bearer "+settings.key.trim()},
      body: JSON.stringify({
        model: settings.model || "deepseek-v4-pro",
        messages:[{role:"user", content:prompt}],
        stream:true,
        temperature: temperature==null? 0.4 : temperature
      }),
      signal
    });
  }catch(err){
    if(err && err.name==="AbortError"){ const e=new Error("cancelled"); e.code="cancelled"; throw e; }
    const e=new Error("连不上 API"); e.code="network"; throw e;   // CORS / 断网 / 被墙
  }
  if(!r.ok){
    let detail="";
    try{ const j=await r.json(); detail = (j.error&&(j.error.message||j.error.type))||""; }catch(_){}
    const e=new Error(detail||("HTTP "+r.status));
    e.code = r.status===401 ? "bad_key"
           : r.status===402 ? "no_balance"
           : r.status===429 ? "rate_limited"
           : "http_"+r.status;
    throw e;
  }
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf="", out="", thinking=false;
  for(;;){
    const {done, value} = await reader.read();
    if(done) break;
    buf += dec.decode(value, {stream:true});
    const lines = buf.split("\n");
    buf = lines.pop();
    for(const line of lines){
      const t = line.trim();
      if(!t.startsWith("data:")) continue;
      const payload = t.slice(5).trim();
      if(payload==="[DONE]") continue;
      let j; try{ j = JSON.parse(payload); }catch(_){ continue; }
      const d = j.choices && j.choices[0] && j.choices[0].delta;
      if(!d) continue;
      if(d.content){ out += d.content; thinking=false; if(onText) onText(out); }
      else if(d.reasoning_content && !out && !thinking){ thinking=true; if(onText) onText("（模型正在推理…）"); }
    }
  }
  if(!out.trim()){ const e=new Error("空回复"); e.code="empty"; throw e; }
  return out;
}

function dsErrorText(code, msg){
  return code==="no_key"      ? "还没填 DeepSeek API key — 去「设置」填一个"
       : code==="bad_key"     ? "API key 不对或已失效（401）"
       : code==="no_balance"  ? "DeepSeek 账户余额不足（402）"
       : code==="rate_limited"? "请求太频繁（429），等几秒再试"
       : code==="network"     ? "连不上 api.deepseek.com — 检查网络，或在设置里换一个中转地址"
       : code==="cancelled"   ? "已取消"
       : code==="empty"       ? "模型没有返回内容，再试一次"
       : "调用失败" + (msg? "："+msg : "");
}

/* ============ 拆解 ============ */
const stripTags = h => {
  const d = document.createElement("div");
  d.innerHTML = String(h||"");
  d.querySelectorAll("math").forEach(m=>{
    const alt = m.getAttribute("alttext");
    m.replaceWith(document.createTextNode(alt? " "+alt+" " : " [公式] "));
  });
  d.querySelectorAll("svg,figure,img").forEach(f=>{
    const alt = f.getAttribute && (f.getAttribute("aria-label")||f.getAttribute("alt"));
    f.replaceWith(document.createTextNode(alt? " [图："+alt+"] " : " [图形] "));
  });
  return d.textContent.replace(/\s+/g," ").trim();
};

function questionAsText(q, st){
  const L = ["ABCD"];
  let s = `【考点】${DOMAINS[q.dom].name} → ${q.sk}｜难度 ${DIFF[q.df]||q.df}｜官方 score band ${q.bd}\n`;
  if(q.sti) s += `【材料】${stripTags(q.sti)}\n`;
  s += `【问题】${stripTags(q.ste)}\n`;
  if(q.ty==="spr") s += `【题型】填空题\n`;
  else q.op.forEach((o,k)=>{ s += `${"ABCD"[k]}. ${stripTags(o)}\n`; });
  s += `【正确答案】${q.an.join(" / ")}\n`;
  if(st){
    s += `【我的作答】${st.picked}${st.ok?"（对）":"（错）"}\n`;
    if(st.why) s += `【我自己标的错因】${(WHY.find(w=>w.k===st.why)||{}).t}\n`;
    if(st.ms) s += `【用时】${Math.round(st.ms/1000)} 秒\n`;
  }
  s += `【College Board 官方解析】${stripTags(q.ra)}\n`;
  return s.slice(0, 24000);
}

/* 讲解反馈 —— 记下来，并拼进以后每一次讲题请求 */
function feedbackRow(q){
  const row = el("div","fbrow");
  const done = (settings.fb||[]).find(f=>f.qid===q.id);
  if(done){
    row.innerHTML = `<span class="fbdone">已反馈：${esc(done.tag)}${done.text? " · "+esc(done.text):""}</span>`;
    const undo = el("button","drillbtn","撤回");
    undo.onclick=()=>{ settings.fb = settings.fb.filter(f=>f.qid!==q.id); saveSettings();
                       row.replaceWith(feedbackRow(q)); };
    row.appendChild(undo);
    return row;
  }
  row.appendChild(el("span","fblbl","这个讲解怎么样？"));
  const add = (tag, needText)=>{
    const b = el("button","fbchip", tag);
    b.onclick = ()=>{
      if(!needText){ pushFb(q.id, tag, ""); row.replaceWith(feedbackRow(q)); return; }
      row.innerHTML = "";
      row.appendChild(el("span","fblbl", tag+" —"));
      const inp = el("input"); inp.type="text"; inp.className="fbinput";
      inp.placeholder = "具体想怎么改？比如「别复述题干，直接说规则」";
      const ok = el("button","drillbtn","提交");
      const send = ()=>{ pushFb(q.id, tag, inp.value.trim()); row.replaceWith(feedbackRow(q));
                         toast("记下了，以后的讲解会照着改"); };
      ok.onclick = send;
      inp.onkeydown = e=>{ if(e.key==="Enter") send(); };
      row.appendChild(inp); row.appendChild(ok);
      inp.focus();
    };
    row.appendChild(b);
  };
  add("有用", false);
  add("没说到点上", true);
  add("太啰嗦", true);
  return row;
}
function pushFb(qid, tag, text){
  settings.fb = (settings.fb||[]).filter(f=>f.qid!==qid);
  settings.fb.push({qid, tag, text, ts:Date.now()});
  settings.fb = settings.fb.slice(-40);
  saveSettings();
}

async function explainOne(holder, q, st, btn, force){

async function explainSession(holder, wrongs, btn){
  if(btn) btn.remove();
  const box = el("div","explain"); box.style.textAlign="left";
  box.innerHTML = `<div class="eyebrow"><span class="spin"></span><span>本组薄弱点分析</span></div>`;
  const body = el("div","body"); box.appendChild(body); holder.appendChild(box);
  let payload = wrongs.map((x,i)=>`第 ${i+1} 题\n`+questionAsText(x.q, x.st)).join("\n---\n");
  payload = payload.slice(0, 40000);
  const prompt =
`你在帮一名中国学生备考数字 SAT（托福 100，目标 R&W 750 / Math 780）。下面是他刚做完一组题里做错的全部题目，含题目、他的选项、他自己标的错因和官方解析。

他要的不是逐题重讲——单题讲解他已经能看。他要的是跨题归因：这些错题合在一起，暴露出的是哪一两个共同的薄弱点。

用中文回答，400 字以内，按这三段写，每段用「■ 标题」开头：
■ 共同的病根 — 把这些错题归成 1–2 类。要具体到可操作的程度，比如"对比类连接词之间分不清"而不是"连接词不熟"；"把'支持论点'的证据题做成了'复述细节'"而不是"证据题弱"。如果这些错题之间确实没有共同规律，就直说是分散失误，不要硬凑。
■ 证据 — 指出是哪几道题让你得出这个结论，各自错在哪一步。
■ 接下来练什么 — 给出具体的下一步：练哪个考点、哪个难度档、大概多少题。

不要写开场白和结束语，不要用 markdown 星号加粗。

---

${payload}`;
  try{
    const text = await dsChat(prompt, {onText: t=>{ body.textContent=t; }});
    box.querySelector(".spin").remove();
    sessionAnalysis = text;
  }catch(e){
    body.textContent = dsErrorText(e && e.code, e && e.message);
    const s=box.querySelector(".spin"); if(s) s.remove();
  }
}

/* ============ 模考报告 ============
   这里刻意不给一个精确分数。College Board 的自适应算分基于 IRT，换算表从未公开，
   任何第三方"换算"都是猜的。下面给的是原始对错 + 分数段证据 + 一个标明规则的估算区间。 */
function bandEstimate(rows){
  // 规则：按 band 从高到低找，第一个「做了 ≥4 题且正确率 ≥60%」的 band 即估算落点。
  const by = {};
  rows.forEach(r=>{ const b=r.bd||0; (by[b]=by[b]||{n:0,ok:0}); by[b].n++; if(r.ok) by[b].ok++; });
  let hit = null;
  for(let b=7;b>=1;b--){
    const s = by[b];
    if(s && s.n>=4 && s.ok/s.n >= 0.6){ hit = b; break; }
  }
  return {by, band:hit};
}

/* ============ Word 导出 ============ */
const xe = s => String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))
                             .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,"");
const BLOCK_TAGS = /^(p|li|div|table|ul|ol|tbody|thead|tr|blockquote)$/;

function normalizeMathFigs(root){
  root.querySelectorAll("math").forEach(m=>{
    const a = m.getAttribute("alttext");
    m.replaceWith(document.createTextNode(a? " "+a+" " : " [公式] "));
  });
  root.querySelectorAll("svg,img,figure").forEach(f=>{
    if(!f.parentNode) return;
    const a = f.getAttribute && (f.getAttribute("aria-label")||f.getAttribute("alt"));
    f.replaceWith(document.createTextNode(a? " [图："+a+"] " : " [图形，见原题] "));
  });
}
function htmlToBlocks(html){
  const root = document.createElement("div");
  root.innerHTML = String(html||"");
  normalizeMathFigs(root);
  const out = [];
  const txt = e => e.textContent.replace(/\s+/g," ").trim();
  const hasBlockChild = e => [...e.children].some(ch=>BLOCK_TAGS.test(ch.tagName.toLowerCase()));
  (function walk(n){
    for(const c of n.childNodes){
      if(c.nodeType===3){ const t=c.textContent.replace(/\s+/g," ").trim(); if(t) out.push({type:"p",text:t}); }
      else if(c.nodeType===1){
        const tag = c.tagName.toLowerCase();
        if(tag==="table"){
          const rows = [...c.querySelectorAll("tr")].map(tr=>[...tr.children].map(td=>txt(td)));
          if(rows.length) out.push({type:"table", rows});
        }else if(hasBlockChild(c)) walk(c);
        else { const t=txt(c); if(t) out.push({type:"p", text:(tag==="li"?"· ":"")+t}); }
      }
    }
  })(root);
  if(!out.length){ const t=txt(root); if(t) out.push({type:"p",text:t}); }
  return out;
}

// OOXML helpers — sizes are half-points, so sz 22 = 11pt
function wP(text, o){
  o = o||{};
  // CT_RPr / CT_PPr child order is schema-enforced; Word rejects the file otherwise.
  // rPr: b, i, color, sz, szCs   —   pPr: shd, spacing, ind, outlineLvl
  const rpr = `<w:rPr>${o.bold?"<w:b/>":""}${o.italic?"<w:i/>":""}`
    + (o.color?`<w:color w:val="${o.color}"/>`:"")
    + `<w:sz w:val="${o.size||22}"/><w:szCs w:val="${o.size||22}"/></w:rPr>`;
  const ppr = `<w:pPr>`
    + (o.shade?`<w:shd w:val="clear" w:color="auto" w:fill="${o.shade}"/>`:"")
    + `<w:spacing w:before="${o.before??40}" w:after="${o.after??40}" w:line="276" w:lineRule="auto"/>`
    + (o.ind?`<w:ind w:left="${o.ind}"/>`:"")
    + (o.outline!=null?`<w:outlineLvl w:val="${o.outline}"/>`:"")
    + `</w:pPr>`;
  const parts = String(text??"").split("\n");
  const runs = parts.map((t,i)=>
    (i?`<w:r>${rpr}<w:br/></w:r>`:"")+`<w:r>${rpr}<w:t xml:space="preserve">${xe(t)}</w:t></w:r>`).join("");
  return `<w:p>${ppr}${runs}</w:p>`;
}
function wRule(){
  return `<w:p><w:pPr><w:pBdr><w:bottom w:val="single" w:sz="6" w:space="1" w:color="C8CCC2"/></w:pBdr>`
    + `<w:spacing w:before="160" w:after="120"/></w:pPr></w:p>`;
}
function wTable(rows){
  const border = v=>`<w:${v} w:val="single" w:sz="4" w:space="0" w:color="B9BEB2"/>`;
  const tblPr = `<w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>`
    + ["top","left","bottom","right","insideH","insideV"].map(border).join("")
    + `</w:tblBorders></w:tblPr>`;
  const body = rows.map((r,ri)=>`<w:tr>`+ r.map(cell=>
      `<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/>${ri===0?'<w:shd w:val="clear" w:color="auto" w:fill="EEF0EA"/>':""}</w:tcPr>`
      + wP(cell,{size:19, bold:ri===0, before:20, after:20}) + `</w:tc>`).join("") + `</w:tr>`).join("");
  return `<w:tbl>${tblPr}${body}</w:tbl>`;
}
function blocksToXml(blocks, opt){
  opt = opt||{};
  let first = true;
  return blocks.map(b=>{
    if(b.type==="table") return wTable(b.rows);
    const text = (first && opt.prefix ? opt.prefix : "") + b.text;
    first = false;
    return wP(text, opt);
  }).join("");
}

function questionXml(q, a, idx, note){
  // a: {picked, ok, ms, why} — from a live run state or a stored attempt
  let x = "";
  x += wP(`${idx}. ${DOMAINS[q.dom].name} → ${q.sk}`, {bold:true, size:24, before:200, outline:1});
  x += wP(`难度 ${DIFF[q.df]||q.df}　|　官方 score band ${q.bd}　|　题型 ${q.ty==="spr"?"填空":"四选一"}　|　Question ID ${q.id}`,
          {size:17, color:"6A7064"});
  if(q.sti){ x += wP("材料", {bold:true, size:19, color:"8A5A00", before:120});
             x += blocksToXml(htmlToBlocks(q.sti), {size:21}); }
  x += wP("题目", {bold:true, size:19, color:"8A5A00", before:120});
  x += blocksToXml(htmlToBlocks(q.ste), {size:21, bold:true});
  if(q.ty!=="spr") q.op.forEach((o,k)=>{
    const L="ABCD"[k];
    const isAns = q.an.includes(L), isMine = a && a.picked===L;
    x += blocksToXml(htmlToBlocks(o), {
      size:21, ind:360, prefix: L+". ",
      bold: isAns,
      color: isAns?"1B6E39":(isMine?"A32A22":null)
    });
  });
  if(a){
    const verdict = a.ok? "正确" : "错误";
    const whyT = a.why? (WHY.find(o=>o.k===a.why)||{}).t : "未标注";
    x += wP(`你的作答：${a.picked}　|　正确答案：${q.an.join(" / ")}　|　${verdict}　|　用时 ${Math.round((a.ms||0)/1000)} 秒${a.ok?"":"　|　错因："+whyT}`,
            {size:19, bold:true, before:120, color:a.ok?"1B6E39":"A32A22", shade:a.ok?"E8F2EA":"F7E6E3"});
  }
  x += wP("College Board 官方解析", {bold:true, size:19, color:"8A5A00", before:120});
  x += blocksToXml(htmlToBlocks(q.ra), {size:20});
  if(note){
    x += wP("AI 拆解", {bold:true, size:19, color:"8A5A00", before:120});
    x += wP(note, {size:20});
  }
  x += wRule();
  return x;
}

async function exportDocx(btn, items, meta, analysis){
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = "生成中…";
  try{
    let x = "";
    x += wP(meta.title, {bold:true, size:36, after:60, outline:0});
    x += wP(`导出于 ${new Date().toLocaleString("zh-CN")}　|　题目来源：College Board SAT Suite Educator Question Bank（抓取于 ${PULLED_ON}）`,
            {size:17, color:"6A7064", after:160});
    if(meta.n!=null){
      x += wTable([
        ["作答","正确","错误","正确率","总用时","均时"],
        [String(meta.n), String(meta.ok), String(meta.n-meta.ok),
         (pct(meta.ok,meta.n)??"—")+"%",
         `${Math.floor(meta.secs/60)} 分 ${meta.secs%60} 秒`,
         `${meta.n?Math.round(meta.secs/meta.n):0} 秒`]
      ]);
    }
    if(analysis){
      x += wP("本组薄弱点分析", {bold:true, size:26, before:220, outline:1});
      x += wP(analysis, {size:21});
    }
    x += wP("逐题记录", {bold:true, size:26, before:240, outline:1});
    items.forEach((it,i)=>{
      const q = it.q, a = it.st || it.a;
      const note = notesByQ[q.id] && notesByQ[q.id].text;
      x += questionXml(q, a, i+1, note);
    });
    x += wP("题目与官方解析版权归 College Board 所有，本文档仅供个人备考使用。",
            {size:16, color:"8A8F84", before:200});

    const blob = await buildDocx(x);
    const name = meta.title.replace(/[\\/:*?"<>|]/g,"·").slice(0,60)
      + " " + new Date().toISOString().slice(0,10) + ".docx";
    saveFile(name, blob);
    toast("已生成 Word 文件");
  }catch(e){
    toast("导出失败（"+((e&&e.message)||"error")+"）");
  }finally{
    btn.disabled = false; btn.textContent = old;
  }
}

/* ============ 导入试卷 ============
   PDF 用 pdf.js 取文字，Word(.docx) 用 JSZip 读 word/document.xml。
   取到的纯文本交给 DeepSeek 结构化成题目，再按标准考试配速计时。 */
let papers = [];        // 存下来的自制试卷
let importText = "";    // 当前提取出的文本

async function extractPdf(file){
  if(typeof pdfjsLib==="undefined") throw new Error("PDF 解析库没加载成功，检查网络");
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({data:buf}).promise;
  const out = [];
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    let last=null, line="";
    const lines=[];
    tc.items.forEach(it=>{
      const y = it.transform[5];
      if(last!==null && Math.abs(y-last)>3){ lines.push(line.trim()); line=""; }
      line += it.str + (it.hasEOL? " " : "");
      last = y;
    });
    if(line.trim()) lines.push(line.trim());
    out.push(lines.filter(Boolean).join("\n"));
  }
  return out.join("\n\n");
}

async function extractDocx(file){
  if(typeof JSZip==="undefined") throw new Error("JSZip 没加载成功，检查网络");
  const zip = await JSZip.loadAsync(await file.arrayBuffer());
  const f = zip.file("word/document.xml");
  if(!f) throw new Error("这不像是一个 .docx 文件");
  const xml = await f.async("string");
  const doc = new DOMParser().parseFromString(xml, "application/xml");
  const W = "http://schemas.openxmlformats.org/wordprocessingml/2006/main";
  const err = doc.querySelector("parsererror");
  if(err) throw new Error("document.xml 解析失败，文件可能损坏");
  const out = [];
  Array.from(doc.getElementsByTagNameNS(W,"p")).forEach(p=>{
    let t = "";
    Array.from(p.getElementsByTagNameNS(W,"t")).forEach(n=>{ t += n.textContent; });
    out.push(t.trim());
  });
  return out.filter(Boolean).join("\n");
}

const PAPER_RULES =
`下面是从一份试卷文件里提取出来的纯文本。把它整理成结构化的题目。

要求：
- 只整理文本里真实存在的题目，不要自己出题、不要补全缺失的题目。
- 一道题一个对象。四选一的题 options 放 4 个选项的文本（不要带 A. B. C. 前缀）；填空题 options 留空数组。
- answer 填正确答案：选择题填 "A"/"B"/"C"/"D"，填空题填答案本身。如果原文没给答案，answer 填 null。
- explanation 填原文里的解析；原文没有就填 null，不要自己编解析。
- stimulus 放题目依赖的阅读材料或题干背景（没有就填空字符串），stem 放实际发问的那句话。
- section 填 "rw"（英文阅读/语法）或 "math"（数学）。
- 数学公式用普通文本写，比如 x^2、sqrt(3)、(a+b)/2。
- 文本里的页眉页脚、页码、答题卡说明一律忽略。

只输出一个 JSON 数组，不要任何解释文字，不要 markdown 代码围栏。格式：
[{"section":"rw","stimulus":"","stem":"","options":["","","",""],"answer":"A","explanation":null}]

如果这段文本里找不到任何题目，就输出 []。

---

`;

function parseJsonLoose(txt){
  let t = String(txt||"").trim();
  t = t.replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"");
  try{ return JSON.parse(t); }catch(e){}
  const a = t.indexOf("["), b = t.lastIndexOf("]");
  if(a>=0 && b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch(e){} }
  throw new Error("模型返回的不是合法 JSON");
}

function toQuestion(o, idx, paperId){
  const secN = (o.section==="math") ? 2 : 1;
  const opts = Array.isArray(o.options)? o.options.filter(x=>x!=null && String(x).trim()!=="") : [];
  const ty = opts.length>=2 ? "mcq" : "spr";
  let an = [];
  if(o.answer!=null && String(o.answer).trim()!==""){
    an = [String(o.answer).trim().toUpperCase().slice(0, ty==="mcq"?1:40)];
    if(ty==="spr") an = [String(o.answer).trim()];
  }
  return {
    id: paperId+"-q"+idx, eid:"", custom:true, paper:paperId,
    sec: secN, dom:"ZZ", domName:"导入试卷", sk:"导入试卷", skc:"ZZ",
    df:"M", bd:0, ty,
    sti: o.stimulus? `<p>${esc(o.stimulus)}</p>` : "",
    ste: `<p>${esc(o.stem||"（无题干）")}</p>`,
    op: opts.slice(0,4).map(x=>`<p>${esc(x)}</p>`),
    an,
    ra: o.explanation? `<p>${esc(o.explanation)}</p>` : "<p>这道题来自导入的文件，原文没有提供解析。可以用下面的「AI 拆解」让模型讲。</p>"
  };
}

// 官方配速：R&W 32min/27题 ≈ 71 秒，Math 35min/22题 ≈ 95 秒
const PACE = {1:71, 2:95};
function paperMinutes(qs){
  const sec = qs.reduce((t,q)=>t+PACE[q.sec], 0);
  return Math.max(1, Math.round(sec/60));
}

function renderImport(app){
  const head = el("div","pagehead");
  head.innerHTML = `<div><h1>导入试卷</h1>
    <p>上传一份 PDF 或 Word 题目文件，让 DeepSeek 整理成可作答的试卷，按 SAT 标准配速计时。

  app.appendChild(head);

  if(!hasKey()){
    const nag = el("div","keynag");

      showPreview(file.name);
    }catch(e){
      st.innerHTML = `<span style="color:var(--bad)">读取失败：${esc(e.message)}</span>`;
    }

  function showPreview(fname){
    const pv = $("#imppreview");

    const ta = el("textarea"); ta.className="pref"; ta.rows=8;

  async function buildPaper(fname, btn, info){

    const chunks = [];
    for(let i=0;i<importText.length;i+=CHUNK) chunks.push(importText.slice(i,i+CHUNK));
    let all = [];
    try{
      for(let i=0;i<chunks.length;i++){
        info.innerHTML = `<span class="spin"></span> 正在整理第 ${i+1} / ${chunks.length} 段…`;
        const txt = await dsChat(PAPER_RULES + chunks[i], {temperature:0});

      info.innerHTML = `<span style="color:var(--bad)">${esc(dsErrorText(e && e.code, e && e.message))}</span>`;

    const blk = el("section","block"); blk.style.marginTop="26px";
    blk.innerHTML = `<div class="blockhead"><h2>我的试卷</h2>

    papers.slice().reverse().forEach(p=>{
      const c = el("div","logcard");
      c.innerHTML = `<header>
          <span class="tag chip">${esc(p.name)}</span>
          <span class="tag chip">${p.n} 题</span>
          <span class="tag chip">建议 ${paperMinutes(p.qs)} 分钟</span>
          ${p.noAns? `<span class="why-t">${p.noAns} 题没有答案</span>`:""}
          <span class="skmeta" style="margin-left:auto">${new Date(p.ts).toLocaleDateString("zh-CN")}</span>
        </header>`;
      const row = el("div","btnrow"); row.style.justifyContent="flex-start"; row.style.marginTop="10px";
      const go = el("button","drillbtn","按标准时间作答");
      go.onclick=()=>{
        p.qs.forEach(q=>BYID[q.id]=q);
        run = null;
        startRun(p.qs, {label:"试卷 · "+p.name, timed:true});
        run.deadline = Date.now() + paperMinutes(p.qs)*60000;
        run.paperTimed = true;
        drawRun();
      };
      const un = el("button","drillbtn","不计时作答");
      un.onclick=()=>{ p.qs.forEach(q=>BYID[q.id]=q); startRun(p.qs,{label:"试卷 · "+p.name, timed:false}); };
      const del = el("button","drillbtn","删除");
      del.onclick=()=>{ if(confirm("删除这份试卷？")){ papers=papers.filter(x=>x.id!==p.id);
                        lsSet("b7_papers",papers); render(); } };
      row.appendChild(go); row.appendChild(un); row.appendChild(del);
      c.appendChild(row);
      blk.appendChild(c);
    });
    app.appendChild(blk);
  }
}

  const eye = el("button","drillbtn","显示");
  eye.onclick=()=>{ const p = key.type==="password"; key.type = p?"text":"password"; eye.textContent = p?"隐藏":"显示"; };
  keyWrap.appendChild(key); keyWrap.appendChild(eye);
  f1.appendChild(keyWrap);
  f1.appendChild(el("div","hint",'在 platform.deepseek.com 的 API keys 页面创建。'));

  const f2 = el("div","field");
  f2.appendChild(el("label",null,"模型"));
  const sel = el("select");
  sel.innerHTML = DS_MODELS.map(m=>
    `<option value="${esc(m.id)}" ${settings.model===m.id?"selected":""}>${esc(m.t)} — ${esc(m.d)}</option>`).join("")
    + `<option value="__custom" ${DS_MODELS.every(m=>m.id!==settings.model)?"selected":""}>自定义…</option>`;
  const custom = el("input"); custom.type="text"; custom.placeholder="模型 ID";
  custom.value = DS_MODELS.every(m=>m.id!==settings.model)? settings.model : "";
  custom.style.marginTop="6px";
  custom.classList.toggle("hide", sel.value!=="__custom");
  sel.onchange=()=>{ custom.classList.toggle("hide", sel.value!=="__custom"); };
  f2.appendChild(sel); f2.appendChild(custom);

  const f3 = el("div","field");
  f3.appendChild(el("label",null,"接口地址"));
  const base = el("input"); base.type="text"; base.value = settings.base||"https://api.deepseek.com";
  f3.appendChild(base);
  f3.appendChild(el("div","hint","默认官方地址。如果直连不通，可以换成自己的中转地址。"));

  const fields = el("div","fields");
  fields.appendChild(f1); fields.appendChild(f2); fields.appendChild(f3);
  card.appendChild(fields);

  const foot = el("footer");
  const status = el("span","avail","");
  foot.appendChild(status);
  const test = el("button","ghost","测试连接");
  const save = el("button","primary","保存");
  const collect = ()=>{
    settings.key = key.value.trim();
    settings.model = sel.value==="__custom" ? custom.value.trim() : sel.value;
    settings.base = base.value.trim() || "https://api.deepseek.com";
  };
  save.onclick=()=>{ collect(); saveSettings(); toast("已保存"); render(); };
  test.onclick=async ()=>{
    collect();
    if(!hasKey()) return status.textContent = "先填 API key";
    test.disabled=true; status.innerHTML = '<span class="spin"></span> 正在测试…';
    try{
      const t = await dsChat("只回复两个字：正常", {temperature:0});
      status.textContent = "连通 ✓ 模型回复：" + t.slice(0,20);
      saveSettings();
    }catch(e){ status.textContent = dsErrorText(e && e.code, e && e.message); }
    finally{ test.disabled=false; }
  };
  foot.appendChild(test); foot.appendChild(save);
  card.appendChild(foot);
  b1.appendChild(card); app.appendChild(b1);

  /* --- 讲题偏好 --- */
  const b2 = el("section","block");
  b2.innerHTML = `<div class="blockhead"><h2>讲题偏好</h2>
    <span class="note">写在这里的要求，会拼进每一次拆解请求</span></div>`;
  const c2 = el("div","builder");
  const ta = el("textarea"); ta.rows=5; ta.className="pref";
  ta.placeholder = "例如：\n不要复述题干，直接说这道题考的能力\n语法题要把规则本身写出来，不要只说「注意主谓一致」\n数学题给出关键一步的推导，不要给完整过程\n可以用英文写术语，其余中文";
  ta.value = settings.pref||"";
  c2.appendChild(ta);
  const f2b = el("footer");
  const fbn = (settings.fb||[]).filter(f=>f.text && f.text.trim()).length;
  f2b.appendChild(el("span","avail",
    `另外已记录 <b>${fbn}</b> 条逐题反馈，最近 6 条会一起发给模型`));
  if(fbn){
    const clr = el("button","ghost","清空反馈");
    clr.onclick=()=>{ settings.fb=[]; saveSettings(); render(); };
    f2b.appendChild(clr);
  }
  const sp = el("button","primary","保存偏好");
  sp.onclick=()=>{ settings.pref = ta.value; saveSettings(); toast("已保存"); };
  f2b.appendChild(sp);
  c2.appendChild(f2b);
  b2.appendChild(c2); app.appendChild(b2);

  /* --- 数据 --- */
  const b3 = el("section","block");
  b3.innerHTML = `<div class="blockhead"><h2>练习数据</h2>
    <span class="note">换电脑：在这边导出，到那边导入</span></div>`;
  const c3 = el("div","builder");
  c3.appendChild(el("div","avail",
    `当前：<b>${attempts.length}</b> 条作答 · <b>${Object.keys(reviewQ).length}</b> 道错题 · <b>${Object.keys(notesByQ).length}</b> 条拆解记录`));
  const row = el("div","btnrow"); row.style.justifyContent="flex-start"; row.style.marginTop="14px";
  const ex = el("button","ghost","导出进度 JSON"); ex.onclick=exportProgress;
  row.appendChild(ex);
  const fileIn = el("input"); fileIn.type="file"; fileIn.accept="application/json,.json"; fileIn.className="hide";
  let mode="merge";
  fileIn.onchange=()=>{ if(fileIn.files[0]) importProgress(fileIn.files[0], mode); fileIn.value=""; };
  const im = el("button","ghost","导入并合并"); im.onclick=()=>{ mode="merge"; fileIn.click(); };
  const ir = el("button","ghost","导入并覆盖"); ir.onclick=()=>{
    if(confirm("覆盖会丢掉这台电脑上现有的全部记录，确定？")){ mode="replace"; fileIn.click(); } };
  row.appendChild(im); row.appendChild(ir); row.appendChild(fileIn);
  const wipe = el("button","ghost","清空本机数据");
  wipe.onclick=()=>{
    if(!confirm("清空这台浏览器上的作答、错题集和拆解记录？API key 和偏好会保留。")) return;
    attempts=[]; reviewQ={}; notesByQ={};
    saveLocal(); lsSet(LS.review,reviewQ); lsSet(LS.notes,notesByQ);
    toast("已清空"); render();
  };
  row.appendChild(wipe);
  c3.appendChild(row);
  c3.appendChild(el("div","hint",
    "导出的文件不含 API key。浏览器清缓存、换浏览器、无痕窗口都会丢记录，建议每周导出一次。"));
  b3.appendChild(c3); app.appendChild(b3);
}

/* ============ source view ============ */
function renderSource(app){
  const head = el("div","pagehead");
  head.innerHTML = `<div><h1>数据来源</h1><p>每一项数据的出处，以及已知的局限。</p></div>`;
  app.appendChild(head);
  const p = el("div","prose");
  const byDom = DOM_ORDER.map(d=>{
    const n = BANK.filter(q=>q.dom===d).length;
    return `<li>${esc(DOMAINS[d].name)} — ${n} 题</li>`;
  }).join("");
  p.innerHTML = `
  <div class="warnbox"><p><b>题目全部来自 College Board 官方题库，非第三方改编、非我生成。</b>
    每道题在作答后都会显示它自己的 Question ID、external_id 和分类标签，可以逐题回官网核对。</p></div>

  <h3>题库</h3>
  <p>来源：<a href="https://satsuiteeducatorquestionbank.collegeboard.org/" target="_blank" rel="noopener">SAT Suite Educator Question Bank</a>，
     College Board 公开发布、无需登录。抓取接口：</p>
  <p><code>POST https://qbank-api.collegeboard.org/msreportingquestionbank-prod/questionbank/digital/get-questions</code><br>
     <code>POST https://qbank-api.collegeboard.org/msreportingquestionbank-prod/questionbank/digital/get-question</code></p>
  <p>抓取日期 ${esc(PULLED_ON)}。接口返回 3,770 条记录；其中 459 条是 <code>external_id</code> 为空的
     legacy 纸质书题目，结构不同且公式以 base64 图片内嵌，已排除。本工具收录 <b>${BANK.length}</b> 道数字 SAT 原生题，
     每道都带 College Board 官方逐选项解析（rationale）。</p>
  <ul>${byDom}</ul>

  <h3>考点与分数段</h3>
  <ul>
    <li>domain 占比与题数 — <a href="https://satsuite.collegeboard.org/media/pdf/digital-sat-test-spec-overview.pdf" target="_blank" rel="noopener">The Digital SAT Suite of Assessments Specifications Overview</a>，Table 2 / Table 3</li>
    <li>score band 对应分数区间 — <a href="https://satsuite.collegeboard.org/media/pdf/skills-insight-digital-sat-suite.pdf" target="_blank" rel="noopener">Skills Insight for the SAT Suite</a>，2026 年 7 月版，Table 3</li>
    <li>考点完整定义 — <a href="https://satsuite.collegeboard.org/media/pdf/assessment-framework-for-digital-sat-suite.pdf" target="_blank" rel="noopener">Assessment Framework for the Digital SAT Suite</a>, v3.01</li>
    <li>考试结构（54 题 / 64 分钟，44 题 / 70 分钟，两模块自适应）— <a href="https://satsuite.collegeboard.org/sat/whats-on-the-test/structure" target="_blank" rel="noopener">How the SAT Is Structured</a></li>
    <li>考试日期 — <a href="https://satsuite.collegeboard.org/sat/registration/dates-deadlines" target="_blank" rel="noopener">SAT Dates and Deadlines</a>（12 月 5 日场，报名截止 11 月 20 日）</li>
  </ul>

  <h3>已知局限</h3>
  <ul>
    <li><b>题库题不等于考场题。</b>Educator Question Bank 里的题是官方发布的练习题，不是某一次真考的原题。</li>
    <li><b>band 标签是题目属性，不是你的分数。</b><code>score_band_range_cd</code> 表示这道题主要区分哪个分数段的考生；
        控制台里的「band 5–7 正确率」是你在这批题上的表现，<b>不是预测分</b>。要拿分数只能做 Bluebook 完整自适应模考。</li>
    <li><b>本工具不自适应。</b>真考是两模块自适应，第二模块难度由第一模块表现决定；这里是定向刷题，用途不同。</li>
    <li><b>计时器只是节奏参考。</b>按 R&W 每题 ≈77 秒、Math ≈95 秒的平均配速提示，真考不按单题计时。</li>
    <li>少数题目的图形是内嵌 SVG，线条为黑色，因此图形一律放在白底板上显示，深色主题下也是白底。</li>
  </ul>

  <h3>这个网站怎么跑的</h3>
  <p>纯静态页面，托管在 GitHub Pages 上，没有后端、没有数据库、不收集任何数据。
     题库（<code>bank.bin</code>，gzip 压缩的 JSON，约 4 MB）在打开时下载到浏览器里，之后答题、判分、看官方解析全在本地完成，不联网。</p>
  <p>练习记录存在你这台浏览器的 localStorage 里。<b>换电脑不会自动同步</b> —— 要用「设置 → 导出进度」拿一个 JSON 文件过去再导入。
     清浏览器缓存、换浏览器、开无痕窗口都会丢记录，建议每周导出一次。</p>
  <p>AI 拆解调用的是 DeepSeek 接口，浏览器直连。你的 API key 只存在自己浏览器的 localStorage 里，
     <b>不在网站代码里、不经过任何中间服务器</b>。这个网站是公开的，但每个访问者都用自己的 key、自己的记录，互相看不到。</p>

  <h3>哪些内容是官方的，哪些不是</h3>
  <ul>
    <li><b>官方</b> — 题目、材料、选项、正确答案，以及标着「College Board 官方解析」的那段 rationale。一字未改。</li>
    <li><b>非官方</b> — 标着「AI 拆解」和「本组薄弱点分析」的内容由 DeepSeek 生成，用来补官方解析不讲的部分：这道题考哪项能力、干扰项怎么设计的、你缺哪一块。
        它是模型推理的产物，<b>可能出错</b>；与官方解析冲突时以官方为准。</li>
    <li><b>非官方</b> — domain 和考点的中文译名、错因分类这五项、错题集的复习间隔（1/3/7/16 天）、
        模考的分数估算规则和 60% 路由阈值，都是这个工具自己定的。</li>
    <li><b>非官方</b> — 「导入试卷」里的题目来自你上传的文件，由模型整理，不是 College Board 的题。</li>
  </ul>

  <h3>模考模式</h3>
  <p>结构照搬官方规格：Reading and Writing 两个模块各 <b>27 题 / 32 分钟</b>，Math 两个模块各 <b>22 题 / 35 分钟</b>，
     两个 section 之间 <b>10 分钟休息</b>。每个模块内按官方 domain 配比抽题（R&W 约 8/7/7/5，Math 约 8/8/3/3），
     R&W 按 Craft and Structure → Information and Ideas → Standard English Conventions → Expression of Ideas 排序，
     每组内由易到难 —— 这些都和真考一致。</p>
  <p>第二模块会根据第一模块的正确率路由：<b>达到 60% 走难的那组，否则走易的那组</b>。
     模考期间不显示对错，全部交卷后一次性出报告。</p>
  <p><b>报告里的分数区间是估算，不是你的 SAT 分数。</b>估算规则写在报告里：按官方 score band 从高到低找，
     第一个「做够 4 题且正确率 ≥60%」的 band 就是落点，band 对应分数取自 Skills Insight Table 3。
     这是本工具自己定的规则。College Board 真正的算分基于 IRT 模型、换算表从未公开，任何第三方换算都是猜的。
     报告里的原始对错数、模块路由和分 band 正确率才是实打实的。</p>
  <p>另外：60% 这个路由阈值也是估的，官方没有公布真实的分流规则。</p>

  <h3>导入试卷</h3>
  <p>上传 PDF 或 .docx，由 DeepSeek 把文字整理成结构化题目。提示词里明确要求<b>只整理文件里真实存在的题，
     不许自己出题、不许编造答案和解析</b>；原文没给答案的题会标出来。</p>
  <p>这类题<b>不计入官方考点统计</b>（band 表、掌握度表都不算它们），因为它们没有 College Board 的考点和 band 标签。
     但会计入学习时长，错了也会进错题集。计时按官方配速折算：R&W 每题 71 秒、Math 每题 95 秒。</p>
  <p>限制：扫描件 / 图片 PDF 读不出文字（需要先 OCR）；老的 .doc 格式不支持，要先另存为 .docx；
     PDF 里的公式和图往往提取不全。整理结果<b>可能有错</b>，作答前建议扫一眼提取出的原文预览。</p>

  <h3>学习时长</h3>
  <p>每场练习记录净答题时长 —— <b>暂停的时间不计入</b>，模考休息的 10 分钟也不计入。
     控制台显示今天、本周、累计时长，以及练习天数和场次。</p>

  <h3>错题集怎么排的</h3>
  <p>做错的题自动进错题集，第 1 天到期。复习时答对就进下一个盒子（间隔 3 天 → 7 天 → 16 天），答错退回第 1 天重来；
     连续答对四轮后毕业、移出队列。这是 Leitner 间隔重复，不是 College Board 的方法，是通用记忆法。</p>

  <h3>你的练习记录</h3>
  <p>共 ${attempts.length} 次作答、${sessions.length} 场练习、累计 ${(timeStats().all/3600000).toFixed(1)} 小时、
     错题集 ${Object.keys(reviewQ).length} 题、已拆解 ${Object.keys(notesByQ).length} 题、自制试卷 ${papers.length} 份，全部在本机。
     记录字段：题号、考点、难度、band、你的选项、对错、耗时、错因标注。</p>
  <p>Word 导出的是 .docx。题目里的数学公式用 College Board 自带的 <code>alttext</code> 英文读法还原，几何图形标为「[图形，见原题]」——
     公式和 SVG 图无法直接转进 Word，这是取舍，不是遗漏。</p>`;
  app.appendChild(p);
}

/* ============ wiring ============ */
function gotoView(v){ view=v; render(); }
document.querySelectorAll("nav.tabs button").forEach(b=>
  b.onclick = ()=>gotoView(b.dataset.view));
$("#themebtn").onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : cur==="light" ? "dark"
    : (matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme", next);
};
document.addEventListener("keydown", e=>{
  if((e.ctrlKey||e.metaKey) && (e.key==="=" || e.key==="+" || e.key==="-" || e.key==="_")){
    e.preventDefault();
    rsIdx = Math.max(0, Math.min(RS_STEPS.length-1, rsIdx + (e.key==="-"||e.key==="_" ? -1 : 1)));
    applyScale(); return;
  }
  if(!run || run.finished || $("#view-run").classList.contains("hide")) return;
  const st = run.state[run.i], q = run.qs[run.i];
  if(e.key==="Escape") return endRun();
  if(q.ty!=="spr" && !st.sub && /^[1-4abcdABCD]$/.test(e.key)){
    const idx = "1234".includes(e.key) ? +e.key-1 : "abcd".indexOf(e.key.toLowerCase());
    if(idx>=0 && idx<q.op.length){ st.picked="ABCD"[idx]; drawRun(); }
  }
  if(e.key==="Enter"){
    if(run.mock){
      saveTime();
      if(run.i < run.qs.length-1){ run.i++; run.t0=Date.now(); drawRun(); }
      return;
    }
    if(!st.sub && st.picked) submit();
    else if(st.sub && (st.ok || st.why)){
      saveTime();
      if(run.i===run.qs.length-1) endRun();
      else { run.i++; run.t0=Date.now(); drawRun(); }
    }
  }
});

boot();
</script>
